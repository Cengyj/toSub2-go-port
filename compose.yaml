name: tosub2-go
services:
  console:
    image: tosub2-go:local
    build:
      context: .
    init: true
    user: "10001:10001"
    ports:
      - "127.0.0.1:${TOSUB2_DOCKER_PORT:-4399}:4399"
    volumes:
      - console-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  console-data:
