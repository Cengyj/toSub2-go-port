name: Go cross-platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build embedded frontend using Go
        run: go run ./cmd/build-web
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build standalone production executable without cgo
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/tosub2
      # Native Windows DPAPI tests run with the ordinary suite above.
      # An unlocked macOS login Keychain is tested explicitly on a user host.
      - name: Native Windows credentials and process cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1
  minimum-go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - run: go test -count=1 ./...
  go-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - name: Pure Go host semantics and complete local protocol fixtures
        env:
          TOSUB2_LEGACY_RUNTIME_TEST: '1'
        run: go test -count=1 -race ./internal/jshost ./internal/legacyruntime ./cmd/tosub2
