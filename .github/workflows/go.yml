name: Go cross-platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/tosub2
      # Native Windows DPAPI tests run with the ordinary suite above.
      # An unlocked macOS login Keychain is tested explicitly on a user host.
      - name: Chromium integration against local fixtures
        if: runner.os == 'Linux'
        env:
          TOSUB2_BROWSER_TEST: '1'
          CHROME_PATH: /usr/bin/google-chrome
        run: go test -count=1 -race ./...
      - name: Native Windows credentials, process cleanup, and browser integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1 -Browser
  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache: true
      - run: go test -count=1 ./...
