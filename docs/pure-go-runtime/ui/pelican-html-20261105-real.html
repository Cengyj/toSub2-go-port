<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3e9">
  <title>鹈鹕的海边骑行</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #304d49;
      --muted: #7c8c7e;
      --paper: #f7f3e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #eaece3;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .postcard {
      position: relative;
      width: min(1200px, 100%);
      overflow: hidden;
      isolation: isolate;
      border: 1px solid #dedfd2;
      border-radius: 26px;
      background: var(--paper);
      box-shadow: 0 26px 70px -30px #344f4938, 0 3px 12px #344f4905;
    }

    .heading {
      position: absolute;
      z-index: 2;
      top: 7.4%;
      left: 5.6%;
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 15px;
      font-size: clamp(8px, 1vw, 11px);
      font-weight: 650;
      letter-spacing: 3px;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      background: #df9569;
    }

    h1 {
      margin: 0;
      font-size: clamp(21px, 3.4vw, 43px);
      font-weight: 650;
      letter-spacing: 4px;
      line-height: 1.4;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(9px, 1.1vw, 13px);
      letter-spacing: 2px;
    }

    .weather {
      position: absolute;
      top: 7.8%;
      right: 5.5%;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: clamp(9px, 1vw, 12px);
      letter-spacing: 2px;
      color: #8a8f77;
    }

    .weather svg { width: 18px; height: 18px; }

    .art {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    .footer {
      position: absolute;
      bottom: 4.2%;
      left: 5.6%;
      right: 5.2%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .caption {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(9px, 1.1vw, 12px);
      color: #788577;
      letter-spacing: 2px;
    }

    .caption .number {
      font-size: 10px;
      letter-spacing: 1px;
      color: #a3aa94;
    }

    .caption .divider {
      width: 25px;
      height: 1px;
      background: #bfc5ae;
    }

    .controls { display: flex; align-items: center; gap: 12px; }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #748675;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7f9d7b;
    }

    .paused .status::before { background: #c0a675; }

    button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #bfc9b3;
      border-radius: 50%;
      background: #f7f3e9b3;
      color: var(--ink);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover { background: #fffaf0; transform: scale(1.06); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #dcaa6f; outline-offset: 4px; }
    button svg { width: 15px; height: 15px; }
    .play-icon { display: none; }
    .paused .play-icon { display: block; }
    .paused .pause-icon { display: none; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .postcard { border-radius: 18px; }
      .eyebrow { letter-spacing: 1.5px; margin-bottom: 7px; }
      .eyebrow::before { width: 14px; }
      h1 { letter-spacing: 2px; }
      .subtitle { margin-top: 6px; letter-spacing: 1px; }
      .weather { gap: 4px; letter-spacing: 1px; }
      .weather svg { width: 14px; height: 14px; }
      .caption { gap: 7px; letter-spacing: 1px; }
      .caption .number, .caption .divider { display: none; }
      .status { display: none; }
      button { width: 29px; height: 29px; }
      button svg { width: 12px; height: 12px; }
    }
  </style>
</head>

            fill="#f4f5e7" stroke="#405b53" stroke-width="3.2"/>
          <path d="M508 328q19 17 39 16 54 38 118 27"
            fill="none" stroke="#d1ddcb" stroke-width="3"/>
          <path d="m723 358 11 4m-20 1 14 4"
            fill="none" stroke="#a4b9a4" stroke-width="2"/>
          <path d="M495 323q9-4 17-4" fill="none" stroke="#fffdf6" stroke-width="4"/>
        </g>
      </g>

      <!-- 近景以与车轮一致的速度向后移动。 -->
      <g id="foreground-drift">
        <use href="#foreground-tile"/>
        <use href="#foreground-tile" x="1200"/>
      </g>
    </svg>

    <footer class="footer">
      <div class="caption">
        <span class="number">NO. 001</span>
        <span class="divider"></span>
        <span>沿着海岸，自在向前</span>
      </div>
      <div class="controls">
        <span class="status" id="status">兜风中</span>
        <button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false" title="暂停动画">
          <svg class="pause-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="3.5" y="2.5" width="3" height="11" rx="1"/>
            <rect x="9.5" y="2.5" width="3" height="11" rx="1"/>
          </svg>
          <svg class="play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M4 2.8q0-1 1-.4l8 4.8q1 .8 0 1.6l-8 4.8q-1 .6-1-.4Z"/>
          </svg>
        </button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);
      const nodes = {
        bicycle: $("bicycle"),
        pelican: $("pelican"),
        rearWheel: $("rear-wheel"),
        frontWheel: $("front-wheel"),
        chainring: $("chainring"),
        frontCrank: $("front-crank"),
        backCrank: $("back-crank"),
        frontLeg: $("front-leg"),
        frontOutline: $("front-leg-outline"),
        backLeg: $("back-leg"),
        backOutline: $("back-leg-outline"),
        frontFoot: $("front-foot"),
        backFoot: $("back-foot"),
        foreground: $("foreground-drift"),
        clouds: $("cloud-drift"),
        water: $("water-drift"),
        road: $("road-marks"),
        shadow: $("bike-shadow"),
        scarf: $("scarf-tail"),
        scarfFold: $("scarf-fold"),
        sun: $("sun-rays"),
        birds: $("birds")
      };

      const postcard = $("postcard");
      const button = $("toggle");
      const status = $("status");
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");

      let paused = motionPreference.matches;
      let elapsed = 0;
      let lastTime = null;
      let frame = null;

      const crank = { x: 581, y: 547, radius: 36 };
      const cadence = 2 * Math.PI / 2.8;
      const gearRatio = 1.3;
      const roadSpeed = cadence * gearRatio * 94;

      function legPath(hipX, hipY, footX, footY) {
        const ankleY = footY - 9;
        const dx = footX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.max(.001, Math.hypot(dx, dy));
        const thigh = 103;
        const shin = 103;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;
        return `M${hipX.toFixed(2)} ${hipY.toFixed(2)} L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L${footX.toFixed(2)} ${ankleY.toFixed(2)}`;
      }

      function render(time) {
        const phase = time * cadence + .35;
        const riderBob = Math.sin(phase * 2) * 2;
        const bikeBob = Math.sin(phase * 2 + .45) * .75;
        const wheelDegrees = time * cadence * gearRatio * 180 / Math.PI;
        const crankDegrees = phase * 180 / Math.PI;

        nodes.bicycle.setAttribute("transform", `translate(0 ${bikeBob.toFixed(2)})`);
        nodes.pelican.setAttribute("transform", `translate(0 ${riderBob.toFixed(2)})`);
        nodes.rearWheel.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);
        nodes.frontWheel.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);
        nodes.chainring.setAttribute("transform", `rotate(${crankDegrees.toFixed(2)} 581 547)`);

        const frontX = crank.x + Math.cos(phase) * crank.radius;
        const frontY = crank.y + Math.sin(phase) * crank.radius;
        const backX = crank.x - Math.cos(phase) * crank.radius;
        const backY = crank.y - Math.sin(phase) * crank.radius;

        const frontPath = legPath(540, 385 + riderBob, frontX, frontY);
        const backPath = legPath(524, 380 + riderBob, backX, backY);

        nodes.frontLeg.setAttribute("d", frontPath);
        nodes.frontOutline.setAttribute("d", frontPath);
        nodes.backLeg.setAttribute("d", backPath);
        nodes.backOutline.setAttribute("d", backPath);
        nodes.frontFoot.setAttribute("transform", `translate(${frontX.toFixed(2)} ${(frontY - 10).toFixed(2)})`);
        nodes.backFoot.setAttribute("transform", `translate(${backX.toFixed(2)} ${(backY - 10).toFixed(2)})`);
        nodes.frontCrank.setAttribute("d", `M581 547L${frontX.toFixed(2)} ${frontY.toFixed(2)}`);
        nodes.backCrank.setAttribute("d", `M581 547L${backX.toFixed(2)} ${backY.toFixed(2)}`);

        nodes.foreground.setAttribute("transform", `translate(${-((time * roadSpeed) % 1200).toFixed(2)} 0)`);
        nodes.clouds.setAttribute("transform", `translate(${-((time * 7) % 1200).toFixed(2)} 0)`);
        nodes.water.setAttribute("transform", `translate(${-((time * 18) % 1200).toFixed(2)} 0)`);
        nodes.road.setAttribute("stroke-dashoffset", ((time * roadSpeed) % 165).toFixed(2));
        nodes.shadow.setAttribute("rx", (263 + Math.sin(phase * 2) * 2).toFixed(2));
        nodes.sun.setAttribute("transform", `rotate(${(time * 2).toFixed(2)})`);
        nodes.birds.setAttribute("transform", `translate(${(-Math.sin(time * .22) * 12).toFixed(2)} ${(Math.sin(time * 1.4) * 3).toFixed(2)})`);

        const flutter = Math.sin(time * 7) * 5;
        const flutter2 = Math.sin(time * 7 - 1) * 3;
        nodes.scarf.setAttribute("d",
          `M579 274 C547 ${259 + flutter2} 522 ${251 + flutter} 490 ${264 + flutter}
           L507 ${273 + flutter} 491 ${285 + flutter}
           Q536 ${275 + flutter2} 575 291Z`);
        nodes.scarfFold.setAttribute("d",
          `M507 ${273 + flutter} Q540 ${267 + flutter2} 572 281`);
      }

      function tick(timestamp) {
        frame = null;
        if (paused || document.hidden) {
          lastTime = null;
          return;
        }
        if (lastTime !== null) {
          elapsed += Math.min((timestamp - lastTime) / 1000, .05);
        }
        lastTime = timestamp;
        render(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function updatePlayback() {
        postcard.classList.toggle("paused", paused);
        button.setAttribute("aria-pressed", String(paused));
        button.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
        button.title = paused ? "播放动画" : "暂停动画";
        status.textContent = paused ? "歇一会儿" : "兜风中";
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        lastTime = null;
        if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
      }

      button.addEventListener("click", () => {
        paused = !paused;
        updatePlayback();
      });

      document.addEventListener("visibilitychange", updatePlayback);

      motionPreference.addEventListener("change", event => {
        paused = event.matches;
        updatePlayback();
      });

      render(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
